<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wfarhali Agent</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/app.css?v=20261101">
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="/static/logo.png" alt="wfarhali"><span class="agent-tag">Agent</span></div>
  <div class="top-right">
    <button type="button" class="langbtn" id="langBtn" title="English / العربية">EN</button>
    <button type="button" class="newchat" id="newChat" title="Start over">طلب جديد ↺</button>
  </div>
</header>

<main class="chat" id="chat" aria-live="polite">
  <section class="hello" id="hello">
    <h1 data-ar="واش حاب تشري اليوم؟" data-en="What would you like to buy today?">واش حاب تشري اليوم؟</h1>
    <p class="en" data-ar="What would you like to buy today? Speak, type or send a photo, in Darija, Arabic or French." data-en="Speak, type or send a photo. The agent understands Algerian Darija, Arabic, French and English.">What would you like to buy today? Speak, type or send a photo, in Darija, Arabic or French.</p>
    <div class="examples">
      <button type="button" data-example="نحوس على بوت شتاء أسود مقاس 39 وفاست، الميزانية 2 ملاين، أنا في قسنطينة" data-example-en="Black winter boots size 39 and a jacket, budget 20000 da, I am in Constantine" data-ar="بوت شتاء أسود + فاست بـ 2 ملاين" data-en="Black winter boots + jacket, 20,000 DZD">بوت شتاء أسود + فاست بـ 2 ملاين</button>
      <button type="button" data-example="فاست شتاء رجالي وشال بـ مليون ونص" data-example-en="Men's winter jacket and a scarf, budget 15000 da" data-ar="فاست رجالي + شال بـ مليون ونص" data-en="Men's winter jacket + scarf, 15,000 DZD">فاست رجالي + شال بـ مليون ونص</button>
      <button type="button" data-example="عندي عرس الجمعة" data-example-en="I have a wedding on Friday" data-ar="عندي عرس الجمعة" data-en="I have a wedding on Friday">عندي عرس الجمعة</button>
    </div>
  </section>
</main>

<form class="composer" id="composer" autocomplete="off">
  <div class="photo-chip" id="photoChip" hidden><img id="photoThumb" alt=""><button type="button" id="photoRemove" aria-label="Remove photo">×</button></div>
  <div class="bar">
    <button type="button" class="icon" id="photoBtn" aria-label="Photo / صورة"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <input type="text" id="text" maxlength="600" placeholder="اكتب طلبك… · Type…" enterkeyhint="send">
    <button type="button" class="icon mic" id="micBtn" aria-label="Speak / احكي"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="button" class="icon" id="audioBtn" aria-label="Voice note file / ملف صوتي" title="ابعث ملاحظة صوتية (واتساب…) · Send a voice note file"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
    <input type="file" id="audioInput" accept="audio/*,.ogg,.opus,.m4a,.mp3,.wav,.aac,.webm" hidden>
    <button type="submit" class="send" id="sendBtn" aria-label="Send / ابعث"><svg viewBox="0 0 24 24"><path d="M20 12 4 4l3 8-3 8z"/></svg></button>
  </div>
</form>

<template id="tplUser"><div class="msg user"><img class="msg-photo" alt="" hidden><p></p><button type="button" class="edit" title="Edit">عدّل ✎</button></div></template>
<template id="tplSteps"><div class="msg agent steps"><p class="title">الوكيل يخدم على طلبك <span class="en">The agent is working on your request</span></p><ol></ol></div></template>
<template id="tplCard"><article class="card"><div class="media"></div><div class="body"><p class="need"></p><h3></h3><p class="store"></p><p class="price"></p></div></article></template>

<script src="/static/app.js?v=20261101"></script>
</body>
</html>
